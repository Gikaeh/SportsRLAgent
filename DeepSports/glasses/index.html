<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>DeepSports Glasses</title>
    <style>
      :root {
        --bg: #232323;
        --fg: #e5e5e5;
        --muted: #a3a3a3;
        --lens: #000;
        --glow: #4dff6a;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f5f5f5; --fg: #1a1a1a; --muted: #555; }
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      main { max-width: 620px; margin: 0 auto; padding: 20px 16px 32px; box-sizing: border-box; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { margin: 0 0 14px; color: var(--muted); }
      .lens {
        background: var(--lens);
        color: var(--glow);
        border-radius: 10px;
        padding: 6px 10px;
        aspect-ratio: 2 / 1;
        width: 100%;
        max-width: 576px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .lens pre {
        margin: 0;
        font: 13px/1.55 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #g2-header { opacity: 0.6; border-bottom: 1px solid #1f5f2a; padding-bottom: 2px; margin-bottom: 4px; }
      .controls { display: none; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .preview .controls { display: flex; }
      .controls button {
        font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--muted);
        background: transparent; color: var(--fg); min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DeepSports</h1>
      <p>Scores are showing on your glasses. This is a copy of what they show.</p>
      <div class="lens" aria-live="polite">
        <pre id="g2-header"></pre>
        <pre id="g2-body">Waiting for the glasses...</pre>
      </div>
      <div class="controls" aria-label="Simulated glasses input">
        <button data-input="tap">Tap</button>
        <button data-input="up">Swipe up</button>
        <button data-input="down">Swipe down</button>
        <button data-input="double">Double-tap</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
